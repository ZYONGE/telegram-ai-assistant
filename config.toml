# 이 파일은 git에 올라간다. 개인정보와 비밀값을 여기에 쓰지 않는다.
# - 비밀값: private/.env에 두고 ${이름}으로 참조한다.
# - 개인을 알아볼 수 있는 값(지역, 학교 주소 등): private/local.toml에 두면 이 파일 위에 덮어쓴다
#   (양식: templates/local.example.toml).

[telegram]
bot_token = "${TELEGRAM_BOT_TOKEN}"
allowed_user_id = "${TELEGRAM_ALLOWED_USER_ID}"

# 모델 호출 (app/llm). provider를 바꾸면 제공사가 바뀐다. 현재 구현: gemini
[llm]
provider = "gemini"
chat_model = "gemini-3.5-flash-lite"
light_model = "gemini-3.5-flash-lite"

# Gemini 모델 ID 목록: https://ai.google.dev/gemini-api/docs/models
[llm.gemini]
# api_key: Cloud 결제 계정을 연결한 Google Cloud 프로젝트의 Gemini API 키 (private/.env의 GEMINI_API_KEY)
# vertex : 같은 프로젝트의 Vertex AI (private/.env의 GOOGLE_APPLICATION_CREDENTIALS, 아래 project 필요)
backend = "api_key"
# 웹 검색(Google 검색 그라운딩) 사용 여부. 끄면 web_search 도구가 꺼져 있다고 답한다.
web_search = true
# 무료 티어는 입력 내용이 제품 개선에 쓰일 수 있다. 프로젝트에 결제 계정을 연결한 뒤 true로 바꾼다.
billing_enabled = false
# 결제 연결 전 무료 티어 키로 운영하는 것을 허용한다 (2026-09-18 사용자 결정, 실행 때마다 경고).
# 결제를 연결하면 false로 되돌린다.
allow_free_tier = true
# vertex일 때만 사용
project = ""
location = "global"

# Google 연동 (캘린더·Gmail). 계정 여러 개를 한 비서가 함께 본다.
# 데스크톱 앱 OAuth 클라이언트 JSON 하나를 private/google_client.json으로 저장하고,
# 계정마다 `py -3.14 -m uv run python -m app.google.login <이름>`을 한 번씩 실행한다.
# 계정 이름은 알림과 일정 표시에 쓰인다. 바꾸고 싶으면 private/local.toml에서 accounts를 통째로 덮어쓴다.
[google]

[[google.accounts]]
label = "개인"
default = true

[[google.accounts]]
label = "학교"

[[google.accounts]]
label = "기타"

# eClass 수집. 학교 주소는 학교를 특정하므로 private/local.toml에, 계정은 private/.env에 둔다
# (ECLASS_ID, ECLASS_PASSWORD). 주소나 계정이 없으면 이 기능만 꺼진다.
[eclass]
# 수집 간격(분). 0이면 수집하지 않는다.
poll_minutes = 90
# 이 시간 넘게 수집이 성공하지 못하면 알린다
stale_hours = 12

# 어떤 화면을 어떻게 다룰지 정하는 규칙 (app/collectors/eclass/scope.py).
# 수준: notify(알림) · brief(브리핑에만) · store(저장만) · off(건드리지 않음)
# 규칙에 안 걸린 화면만 가벼운 모델이 분류한다. 모델이 꺼져 있어도 수집은 돈다.
# "게시판은 알리지 마"처럼 대화로 바꾼 것은 private/eclass_scope.json에 남고 이 규칙보다 앞선다.
[eclass.scope]
# 규칙과 모델 둘 다 정하지 못한 화면을 어떻게 둘지
unknown = "off"
# 경로로 먼저 정한다. 사이트 구조라 메뉴 이름보다 덜 흔들린다.
# 마감이 있는 것(과제·시험·온라인강의·팀프로젝트)은 할 일 화면이 한곳에서 알린다.
# 과목방 게시판은 같은 것을 또 알리지 않도록 저장만 한다.
notify_paths = ["notice", "notification", "todo_list", "message", "calendar", "schedule"]
store_paths = ["material", "plan_form", "attendance", "attend_list", "eval", "discuss", "qna", "file_list", "report_list", "test_list", "project_list", "online_list", "zoom_list", "record_list"]
# 게시판이 아닌 화면(수강 과목 목록·시간표)은 글 목록 파서로 읽으면 엉뚱한 것이 담긴다.
# 학사일정은 eClass 화면이 비어 있다 (세 가지 요청 방식 모두 확인, 2026-09-20). 학교 포털을 봐야 한다.
off_paths = ["guide", "survey", "share", "ocw", "introduce", "myinfo", "clicker", "menual", "career", "site_link", "sent_list", "popup", "/pf/", "course_ing", "academic_timetable", "academic_calendar"]
# 경로로 못 정하면 메뉴 이름을 본다. 이름은 외부에서 온 글자라 규칙에 넣기만 한다.
notify_words = ["공지", "알림", "쪽지", "과제", "시험", "퀴즈", "휴강", "보강", "학사일정"]
store_words = ["자료", "게시판", "계획서", "출석", "성적", "토론", "질의"]
off_words = ["FAQ", "설문", "소모임", "소개", "안내", "도움말", "투표", "매뉴얼"]

# 메일 (Gmail). 유형 규칙은 대화로 등록하고 DB에 저장된다.
# 학교 도메인처럼 개인을 알아볼 수 있는 보호 도메인은 private/local.toml의 [mail] protected_domains에 둔다.
[mail]
# 수집 간격(분). 0이면 메일 수집을 하지 않는다.
poll_minutes = 10

# 날씨 (기상청 단기예보). 키는 private/.env의 WEATHER_API_KEY에 둔다.
# 기준 좌표는 (1) 텔레그램으로 보낸 최근 위치, (2) private/local.toml에 적어 둔 동네 순으로 고른다.
# 좌표는 개인정보라 이 파일에 적지 않는다. 키가 없으면 날씨 기능만 꺼진다.
[weather]
# 텔레그램으로 보낸 위치를 따라간다 (실시간 위치 공유 중에는 자동 갱신)
follow_telegram_location = true
# 받은 위치의 유효 시간. 0이면 만료 없이 마지막 위치를 계속 쓴다.
location_ttl_hours = 0
# 이 시간 안에 받은 위치는 "현재 위치", 그보다 오래되면 "마지막 위치"로 표시한다
location_recent_hours = 6

[notification]
quiet_start = "23:00"
quiet_end = "06:30"
daily_limit = 5

[briefing]
morning = "07:00"
evening = "22:00"
# 주간 계획은 일요일 이 시각에 보낸다
weekly = "21:00"

[conversation]
idle_compact_minutes = 30
max_active_messages = 80

# 개인 데이터는 private/ 폴더 하나에 모은다 (git 제외)
[storage]
db_path = "private/assistant.db"
memory_path = "private/memory.md"
profile_path = "private/profile.md"
# 사용자가 직접 쓰는 판단 기준 (말투, 보고 방법, 메일·일정 처리 방침)
instructions_path = "private/instructions.md"
system_prompt_path = "prompts/system_prompt.md"
