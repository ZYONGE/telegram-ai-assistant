# 개인 설정 덮어쓰기 양식. private/local.toml로 복사해 쓴다 (git 제외).
# config.toml과 같은 구조이며, 여기에 쓴 항목만 덮어쓴다.
# 지역·학교 주소처럼 개인을 알아볼 수 있는 값은 config.toml이 아니라 이 파일에 둔다.
# 비밀값(키·토큰·비밀번호)은 이 파일이 아니라 private/.env에 둔다.

# [briefing]
# morning = "07:30"

# 날씨 기준 동네 (예비용).
# 평소에는 텔레그램으로 보낸 최근 위치를 따라가고, 위치가 없거나 오래되면 여기 값을 쓴다.
# 격자 좌표를 알면 nx·ny를, 모르면 위경도를 적는다 (둘 중 하나만).
# 지역 이름 place는 브리핑에 그대로 나온다. 비워 두면 표시하지 않는다.
# [weather]
# nx = 60
# ny = 127
# lat = 37.5665
# lon = 126.9780
# place = "우리 동네"

# 휴지통 이동에서 제외할 도메인 (학교, 지원 기업 등). 등록한 교수님·지원기업 규칙은 자동으로 보호된다.
# [mail]
# protected_domains = ["example.ac.kr"]

# 학교 포털·eClass 주소 (학교를 특정하므로 공개 저장소에 두지 않는다)
# [eclass]
# portal_url = "https://portal.example.ac.kr"
# eclass_url = "https://eclass.example.ac.kr"
