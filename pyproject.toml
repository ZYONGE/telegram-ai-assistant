[project]
name = "telegram-ai-assistant"
version = "0.1.0"
description = "사용자 개인용 텔레그램 AI 비서"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    # Windows에는 시스템 시간대 DB가 없어서 zoneinfo가 이 패키지를 사용한다
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
